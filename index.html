<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/matchstrike.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/matchstrike.svg" />
    <meta name="description" content="Матчи, игровые серверы и статистика сообщества MatchStrike" />
    <title>MatchStrike — CS Community</title>
    <script>
      try {
        const theme = localStorage.getItem('matchstrike.theme')
        document.documentElement.classList.toggle('dark', theme !== 'light')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
